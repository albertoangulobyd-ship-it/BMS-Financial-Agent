# Tolerancias y umbrales de las reglas (spec §7, validacion-facturas.md §4).
#
# Se aplica con `bms-agent politica cargar config/reglas.yaml`: queda en la
# politica con su hash, y su valor entra en la huella de cada hallazgo de una
# regla que lo usa (aflojar una tolerancia hace que una anulacion ya no
# valga). Mientras no se carga, valen los mismos valores desde el codigo
# (reglas.base.Politica). Lo que bloquea, lo que no se anula y lo que es
# pegajoso no esta aqui: no se puede relajar desde un fichero.

aritmetica:
  # Redondeo admitido por linea y por factura (D2, D2b, D3, D4).
  tolerancia_linea: "0.01"
  tolerancia_factura: "0.02"

duplicados:
  # B3: el mismo total como mucho a estos dias, con esta diferencia.
  ventana_dias: 14
  tolerancia: "0.01"

cuentas:
  # true: lo heredado del primer maestro no se paga hasta atestarlo o
  # verificarlo por telefono (decision 3, lo estricto de D2).
  solo_verificadas: false
  # Tras un cambio del telefono de verificacion, dias en que no vale ninguna
  # verificacion por telefono de ese proveedor (decision 4, F8 y F9).
  enfriamiento_telefono_dias: 14

frescura:
  # Edad maxima de cada fuente antes de Z1 (decision 7). Pasada, las reglas
  # que dependen de ella dan sin datos, nunca ok.
  exact_dias: 7
  trnsprnt_dias: 7
  extractos_dias_laborables: 3

pagos:
  # Una factura esta pagada cuando lo confirmado deja su saldo dentro de esto
  # (decision 5); un pago parcial la deja pendiente o vencida con su saldo (K2).
  tolerancia: "0.00"
  # K1: una venta cuenta como vencida pasados estos dias de su vencimiento (una
  # compra, desde el dia siguiente).
  dias_vencida_venta: 14
  # K3: dias que un pago marcado a mano puede estar sin rastro en un extracto.
  dias_pago_sin_extracto: 7
  # K7: dias que un movimiento del banco puede quedar sin casar con una factura.
  dias_movimiento_sin_casar: 7
  # K4: dos cargos iguales a la misma contraparte con la misma referencia en
  # menos de estos dias son un pago doble.
  ventana_doble_pago_dias: 30

ordenes_compra:
  # P5: avisa cuando lo consumido de una PO (sin IVA) llega a este porcentaje
  # de su valor vigente.
  aviso_consumo_pct: 80
  # P7: avisa cuando la PO caduca dentro de estos dias y le queda valor.
  dias_caducidad: 30
  # P9: avisa si, al ritmo de las ultimas semanas, la PO se agota antes de
  # estos dias de su fin...
  margen_prevision_dias: 14
  # ...con el ritmo de estas semanas de facturas (por fecha de factura).
  semanas_ritmo: 8

tarifas:
  # G3: una compra por encima de la tarifa pactada retiene; por encima de este
  # porcentaje sobre la pactada, bloquea (y anularlo pide segunda firma).
  exceso_bloqueo_pct: 10

planning:
  # G1: con el planning obligatorio, una compra sin ningun turno de su
  # proveedor en lo facturado bloquea (y anularla pide segunda firma); si no,
  # retiene.
  obligatorio: false
  # G2, V1 y G6: horas facturadas y del planning se admiten distintas en esto
  # por cada dia comparado (0,25 pasa; 0,26 no).
  tolerancia_horas_dia: "0.25"
  # V6: sin ciclo de facturacion, el trabajo sin facturar de un mes se busca
  # pasados estos dias de su fin (con ciclo, los dias de gracia del ciclo).
  dias_gracia_sin_ciclo: 14
