[project]
name = "bms-agent"
version = "0.1.0"
description = "Agente de administracion financiera para BMS Support. Fase 0: observador."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.6",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    # Windows no trae la base de zonas horarias; reloj.hoy() la necesita.
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
bms-agent = "bms_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"bms_agent.almacen" = ["sql/*.sql"]
# Paso 15: la app local construida (frontend/ -> src/bms_agent/web) y los catalogos de
# textos que importa: un paquete instalado con pip tiene que poder servir /app.
"bms_agent" = ["web/*.html", "web/*.json", "web/assets/*", "web/licenses/*", "textos/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
