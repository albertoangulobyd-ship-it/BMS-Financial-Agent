[project]
name = "bms-agent"
version = "0.1.0"
description = "Agente de administracion financiera para BMS Support. Fase 0: observador."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.6",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
bms-agent = "bms_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
